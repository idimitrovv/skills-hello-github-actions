name: Workflow just for testing needs

on:
  workflow_dispatch:

jobs:
  step-1:
    name: Just testing
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Add Annotations
        run: |
          echo "::warning title=No documentation artifacts::No documentation artifacts where produced by this build"
          echo "::error title=No documentation artifacts::No documentation artifacts where produced by this build"
          echo "::notice title=No documentation artifacts::No documentation artifacts where produced by this build"
          echo "${{ github.action }}"

      - name: Publish package test
        uses: ./.github/actions/composite-test
        with:
          PACKAGES_FOLDER_PATH: ${{ github.action }}
    
